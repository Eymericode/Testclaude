name: Déploiement GitHub Pages

on:
  push:
    branches:
      - claude/fortnite-stats-tracker-iw1nqe
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule les déploiements en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Le dépôt est public : on tente d'activer Pages automatiquement.
          enablement: true

      - name: Envoi du site (racine du dépôt)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
