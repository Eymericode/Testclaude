<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#00cec9"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00cec9"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00cec9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00cec9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="192" height="192" rx="42" fill="#0e1020"/>
  <circle cx="96" cy="96" r="72" fill="url(#halo)"/>

  <!-- Hexagone extérieur -->
  <path d="M96 40 L144.5 68 L144.5 124 L96 152 L47.5 124 L47.5 68 Z"
        fill="none" stroke="url(#edge)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Hexagone intérieur -->
  <path d="M96 62 L125.4 79 L125.4 113 L96 130 L66.6 113 L66.6 79 Z"
        fill="url(#edge)" fill-opacity="0.14"
        stroke="url(#edge)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Nœuds aux sommets -->
  <circle cx="96" cy="40" r="4.5" fill="#00cec9"/>
  <circle cx="144.5" cy="68" r="4.5" fill="#6c5ce7"/>
  <circle cx="144.5" cy="124" r="4.5" fill="#00cec9"/>
  <circle cx="96" cy="152" r="4.5" fill="#6c5ce7"/>
  <circle cx="47.5" cy="124" r="4.5" fill="#00cec9"/>
  <circle cx="47.5" cy="68" r="4.5" fill="#6c5ce7"/>

  <!-- Cœur lumineux (étincelle 4 branches) -->
  <path d="M96 66 L104 88 L126 96 L104 104 L96 126 L88 104 L66 96 L88 88 Z"
        fill="url(#core)" stroke="#d9fff9" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="96" cy="96" r="5" fill="#eafffb"/>
</svg>
